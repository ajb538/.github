name: Gemini PR Review (Reusable)

on:
  workflow_call:
    secrets:
      GEMINI_API_KEY:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: pr-diff
        run: |
          git fetch origin "${{ github.base_ref }}"
          DIFF=$(git diff "origin/${{ github.base_ref }}...HEAD" \
            -- . ':!*.lock' ':!package-lock.json' ':!yarn.lock' ':!*.min.js' ':!*.min.css' ':!dist/**' \
            2>/dev/null | head -c 51200)

          if [ -z "$DIFF" ]; then
            echo "No diff found, skipping review"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "$DIFF" > /tmp/pr_diff.txt
          echo "diff_size=$(wc -c < /tmp/pr_diff.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Call Gemini API
        id: gemini
        if: steps.pr-diff.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          DIFF=$(cat /tmp/pr_diff.txt)

          PAYLOAD=$(jq -n \
            --arg diff "$DIFF" \
            '{
              contents: [{
                parts: [{
                  text: ("You are a senior software engineer conducting a code review. Review the following PR diff and provide constructive feedback.\n\nFocus on:\n1. **Bugs or logic errors** — incorrect behaviour, off-by-one errors, null dereferences\n2. **Security issues** — injection risks, hardcoded secrets, missing input validation\n3. **Missing edge cases** — unhandled inputs, race conditions\n4. **Code quality** — clarity, naming, unnecessary complexity\n5. **Test coverage** — missing tests for new or changed logic\n\nBe specific. Cite file names and approximate line numbers where relevant. Skip trivial style nits.\n\nFormat your response as:\n## Summary\n(1–2 sentence overview)\n\n## Issues Found\n(list critical and important issues, or \"None\" if clean)\n\n## Suggestions\n(optional improvements, clearly labelled as non-blocking)\n\n## Verdict\n(✅ Approve / ⚠️ Approve with comments / ❌ Request changes)\n\n---\n**PR Diff:**\n" + $diff)
                }]
              }],
              generationConfig: {
                temperature: 0.2,
                maxOutputTokens: 2048
              }
            }')

          RESPONSE=$(curl -sf \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ $? -ne 0 ]; then
            echo "Gemini API call failed"
            exit 1
          fi

          REVIEW=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "Review unavailable — check API response."')
          echo "$REVIEW" > /tmp/review.txt

      - name: Post review comment
        if: steps.pr-diff.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review.txt', 'utf8');
            const diffSize = '${{ steps.pr-diff.outputs.diff_size }}';

            const body = [
              '### 🤖 Gemini Code Review',
              '',
              review,
              '',
              '---',
              `*Reviewed ${Number(diffSize).toLocaleString()} bytes of diff · Powered by Gemini 3 Flash*`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
